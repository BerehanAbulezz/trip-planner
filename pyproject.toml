[project]
name = "trip-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Berehan", email = "berehanabulezz@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "tavily-python>=0.8.4",
]

[project.scripts]
trip-planner = "trip_planner:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
